name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Syntax check
        run: python -m py_compile safehouse/*.py safehouse_cli/*.py tracer.py

      - name: Run tests
        run: python -m pytest tests/ -v
