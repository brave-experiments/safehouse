[project]
name = "safehouse"
version = "0.1.0"
requires-python = ">=3.12"  # CVE-2023-24329: urlsplit C0/space stripping fixed in 3.12
dependencies = ["anthropic>=0.40,<1", "httpx>=0.27,<1", "mcp[cli]>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
safehouse = "safehouse_cli.cli:main"

[tool.setuptools]
py-modules = ["tracer"]

[tool.setuptools.packages.find]
include = ["safehouse*", "safehouse_cli*"]
