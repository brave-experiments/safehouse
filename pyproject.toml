[build-system]
# PEP 660 editable installs (`pip install -e .`) require setuptools >= 64;
# the PEP 639 SPDX `license` expression below requires >= 77.
# Declaring the backend explicitly prevents pip's legacy-fallback error.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "safehouse"
description = "Information-flow kernel for agent pipelines: labels, slots, capabilities, and policy gates"
version = "0.1.0"
requires-python = ">=3.12"  # CVE-2023-24329: urlsplit C0/space stripping fixed in 3.12
license = "MPL-2.0"
readme = "README.md"
dependencies = ["anthropic>=0.40,<1", "httpx>=0.27,<1", "tomli-w>=1,<2"]

[project.urls]
repository = "https://github.com/brave-experiments/safehouse"

[project.optional-dependencies]
dev = ["pytest"]
google = ["google-auth>=2,<3"]

[project.scripts]
safehouse = "safehouse_cli.cli:main"

[tool.setuptools]
py-modules = ["tracer"]

[tool.setuptools.packages.find]
include = ["safehouse*", "safehouse_cli*"]
